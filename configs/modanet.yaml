dataset:
  root: /home/truongtn/MoDANet-dataset
  mat_variable: data

  num_samples: 450120

  snapshots: 1024
  antennas: 5
  iq_channels: 2

  num_mod_classes: 12
  modulations:
    - 16APSK
    - 16QAM
    - 4PAM
    - 64QAM
    - 8FSK
    - 8PSK
    - DSB-SC
    - LFM
    - PSK
    - QFSK
    - QPSK
    - SSB-SC

  doa_min: -60
  doa_max: 60
  doa_step: 1
  num_doa_classes: 121

loader:
  num_workers: 8
  pin_memory: false
  persistent_workers: true

model:
  mamba:
    d_model: 64
    num_layers: 2
    d_state: 16
    d_conv: 4
    expand: 2
    dt_rank: auto

  signal_adapter:
    delta_init_std: 0.001

  doa_head:
    conv_channels:
      - 32
      - 64
      - 64

    kernel_size: 3
    pool_kernel_size: 2
    pool_stride: 2
    feature_dim: 128

training:
  seed: 42
  train_fraction: 0.8

  batch_size: 64
  epochs: 10

  learning_rate: 0.001
  weight_decay: 0.0
  grad_clip_norm: 1.0

  output_dir: outputs/modanet_doa
